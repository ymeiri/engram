[package]
name = "engram-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic scorer for Engram engineering-context evaluations"
publish = false

[[bin]]
name = "engram-eval"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
engram-core.workspace = true
engram-embed.workspace = true
engram-index.workspace = true
engram-mcp.workspace = true
engram-store.workspace = true
getrandom = "=0.3.4"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
surrealdb-core = { version = "=2.6.0", default-features = false, features = ["kv-mem"] }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
unicode-normalization = "0.1"
libc = "0.2"
zeroize = "1"

[dev-dependencies]
tempfile.workspace = true
