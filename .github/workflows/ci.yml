name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      ENGRAM_EMBED_CACHE_DIR: ${{ github.workspace }}/engram-tests/.fastembed_cache
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /opt/ghc /usr/local/share/ghc
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Cache embedding model
        uses: actions/cache@v5
        with:
          path: engram-tests/.fastembed_cache
          key: ${{ runner.os }}-fastembed-all-MiniLM-L6-v2-v1
      - name: Warm embedding model cache
        run: |
          for attempt in 1 2 3; do
            if cargo run --locked -p engram-cli --bin engram -- warmup embeddings \
              --cache-dir "$ENGRAM_EMBED_CACHE_DIR"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - run: cargo test --locked --all-targets --jobs 1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps

  package-smoke:
    name: Package Smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            os: ubuntu-latest
            archive_triple: x86_64-unknown-linux-gnu
          - platform: Linux ARM64
            os: ubuntu-24.04-arm
            archive_triple: aarch64-unknown-linux-gnu
          - platform: macOS Apple Silicon
            os: macos-latest
            archive_triple: aarch64-apple-darwin
          - platform: macOS Intel
            os: macos-15-intel
            archive_triple: x86_64-apple-darwin
          - platform: Windows x64
            os: windows-2022
            archive_triple: x86_64-pc-windows-msvc
          - platform: Windows ARM64
            os: windows-11-arm
            archive_triple: aarch64-pc-windows-msvc
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      ENGRAM_EMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Cache embedding model
        uses: actions/cache@v5
        with:
          path: .fastembed_cache
          key: ${{ runner.os }}-${{ runner.arch }}-fastembed-all-MiniLM-L6-v2-v1
      - name: Verify package host triple
        shell: bash
        run: |
          actual_triple="$(rustc -vV | awk '/^host:/ { print $2 }')"
          if [ "$actual_triple" != "${{ matrix.archive_triple }}" ]; then
            echo "expected ${{ matrix.archive_triple }}, got $actual_triple" >&2
            exit 1
          fi
      - name: Package install smoke (Unix)
        if: runner.os != 'Windows'
        run: ./scripts/package-install-smoke.sh
      - name: Package install smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-install-smoke-windows.ps1
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: engram-${{ matrix.archive_triple }}
          path: |
            dist/engram-*-${{ matrix.archive_triple }}.tar.gz
            dist/engram-*-${{ matrix.archive_triple }}.tar.gz.sha256
            dist/engram-*-${{ matrix.archive_triple }}.zip
            dist/engram-*-${{ matrix.archive_triple }}.zip.sha256
          if-no-files-found: error
