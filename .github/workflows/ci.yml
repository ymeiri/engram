name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      ENGRAM_EMBED_CACHE_DIR: ${{ github.workspace }}/engram-tests/.fastembed_cache
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /opt/ghc /usr/local/share/ghc
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: engram-tests/.fastembed_cache
          key: ${{ runner.os }}-fastembed-all-MiniLM-L6-v2-v1
      - name: Warm embedding model cache
        run: |
          for attempt in 1 2 3; do
            if cargo run --locked -p engram-cli --bin engram -- warmup embeddings \
              --cache-dir "$ENGRAM_EMBED_CACHE_DIR"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - run: cargo test --locked --all-targets --jobs 1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps
